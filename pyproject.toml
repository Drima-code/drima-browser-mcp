[project]
name = "drima-browser-mcp"
version = "0.1.0"
description = "Local persistent browser MCP with authenticated service and stdio clients"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "mcp>=2.2,<3",
    "playwright==1.62.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
drima-browser = "drima_browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drima_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
